[workspace]
members = [
    "server",
    "client",
    "common",
]
resolver = "3"

[workspace.package]
name = "rcssserver_proxy"
version = "0.1.0"
edition = "2024"
authors = ["EnricLiu"]
license = "MIT"
repository = "https://github.com/EnricLiu/rcssserver_proxy"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tungstenite = { version = "0.28", features = ["http"] }

toml = { version = "0.9", features = ["fast_hash"] }
thiserror = "2"
