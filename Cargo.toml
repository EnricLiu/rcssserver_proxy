[workspace]
members = [
    "server",
    "client",
    "common",
]
resolver = "3"

[workspace.package]
name = "rcssserver_proxy"
version = "0.1.0"
edition = "2024"
authors = ["EnricLiu"]
license = "MIT"
repository = "https://github.com/EnricLiu/rcssserver_proxy"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
tungstenite = "0.28"
tokio-tungstenite = "0.28"

log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
toml = { version = "0.9", features = ["fast_hash"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
